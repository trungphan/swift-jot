<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swift Jot</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <div class="app-container">
      <header class="app-header">
        <div class="brand">
          <div class="brand-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
            </svg>
          </div>
          <span class="brand-title">Swift Jot</span>
        </div>
        <div class="header-actions">
          <span id="save-status" class="status-indicator">Saved</span>
          <button id="media-link-btn" class="icon-btn" title="Insert media link (Alt+M)" aria-label="Insert media link">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="18" rx="3" />
              <polygon points="10 8 16 12 10 16 10 8" fill="currentColor" stroke="none" />
            </svg>
          </button>
          <button id="timestamp-btn" class="icon-btn" title="Insert media timestamp (Alt+T)" aria-label="Insert media timestamp">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10" />
              <polyline points="12 6 12 12 16 14" />
            </svg>
          </button>
          <button id="copy-btn" class="icon-btn" title="Copy to clipboard" aria-label="Copy note">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
            </svg>
          </button>
          <button id="clear-btn" class="icon-btn" title="Clear note" aria-label="Clear note">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6" />
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
            </svg>
          </button>
        </div>
      </header>

      <div id="timestamp-bar" class="timestamp-bar" aria-label="Advanced playback control">
        <div class="playback-controls-group">
          <button id="quick-jump-btn" class="ctrl-btn jump-btn" type="button" title="Jump media to timestamp">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3" />
            </svg>
            <span>Jump</span>
          </button>

          <button id="back-10s-btn" class="ctrl-btn" type="button" title="Rewind 10 seconds (-10s)" aria-label="Rewind 10 seconds">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="11 17 6 12 11 7" />
              <polyline points="18 17 13 12 18 7" />
            </svg>
            <span>-10s</span>
          </button>

          <button id="play-pause-btn" class="ctrl-btn play-pause-btn" type="button" title="Play media" aria-label="Play or pause media">
            <svg id="play-icon" width="10" height="10" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3" />
            </svg>
            <svg id="pause-icon" class="hidden" width="10" height="10" viewBox="0 0 24 24" fill="currentColor">
              <rect x="6" y="4" width="4" height="16" rx="1" />
              <rect x="14" y="4" width="4" height="16" rx="1" />
            </svg>
            <span id="play-pause-text">Play</span>
          </button>
        </div>

        <div class="playback-divider"></div>

        <div class="loop-controls-group">
          <button id="set-a-btn" class="ctrl-btn loop-btn" type="button" title="Set A position (select timestamp in text first)" aria-label="Set A position">
            <span class="badge-letter">A</span>
            <span id="label-pos-a" class="loop-time-label">--:--</span>
          </button>

          <button id="set-b-btn" class="ctrl-btn loop-btn" type="button" title="Set B position (select timestamp in text first)" aria-label="Set B position">
            <span class="badge-letter">B</span>
            <span id="label-pos-b" class="loop-time-label">--:--</span>
          </button>

          <button id="loop-toggle-btn" class="ctrl-btn loop-toggle-btn" type="button" title="Toggle A-B loop (OFF)" aria-label="Toggle A-B loop" aria-pressed="false">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="17 1 21 5 17 9" />
              <path d="M3 11V9a4 4 0 0 1 4-4h14" />
              <polyline points="7 23 3 19 7 15" />
              <path d="M21 13v2a4 4 0 0 1-4 4H3" />
            </svg>
            <span>Loop</span>
          </button>
        </div>
      </div>

      <main class="editor-section">
        <div class="editor-container">
          <div id="highlight-layer" class="highlight-layer" aria-hidden="true"></div>
          <textarea
            id="note-textarea"
            placeholder="Jot down quick thoughts, links, or scratchpad notes..."
            autofocus
            spellcheck="false"
          ></textarea>
        </div>
      </main>

      <footer class="app-footer">
        <button
          id="resize-handle-left"
          class="resize-handle resize-handle-left"
          type="button"
          title="Drag to resize window (double-click to reset)"
          aria-label="Resize window from bottom-left"
        >
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <line x1="1" y1="9" x2="9" y2="1" />
            <line x1="1" y1="5" x2="5" y2="1" />
            <line x1="1" y1="1" x2="1" y2="1" />
          </svg>
        </button>
        <div class="meta-info">
          <span id="char-count">0 chars</span>
          <span class="divider">·</span>
          <span id="word-count">0 words</span>
        </div>
        <div id="toast" class="toast" aria-live="polite"></div>
        <button
          id="resize-handle-right"
          class="resize-handle resize-handle-right"
          type="button"
          title="Drag to resize window (double-click to reset)"
          aria-label="Resize window from bottom-right"
        >
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <line x1="9" y1="9" x2="1" y2="1" />
            <line x1="9" y1="5" x2="5" y2="1" />
            <line x1="9" y1="1" x2="9" y2="1" />
          </svg>
        </button>
      </footer>
    </div>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
