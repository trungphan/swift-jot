<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swift Jot</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <div class="app-container">
      <header class="app-header">
        <div class="brand">
          <div class="brand-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
            </svg>
          </div>
          <span class="brand-title">Swift Jot</span>
        </div>
        <div class="header-actions">
          <span id="save-status" class="status-indicator">Saved</span>
          <button id="video-link-btn" class="icon-btn" title="Insert YouTube video link (Alt+Y)" aria-label="Insert YouTube video link">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
              <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
            </svg>
          </button>
          <button id="facebook-link-btn" class="icon-btn" title="Insert Facebook link (Alt+F)" aria-label="Insert Facebook link">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
              <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
            </svg>
          </button>
          <button id="timestamp-btn" class="icon-btn" title="Insert video timestamp (Alt+T)" aria-label="Insert video timestamp">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10" />
              <polyline points="12 6 12 12 16 14" />
            </svg>
          </button>
          <button id="copy-btn" class="icon-btn" title="Copy to clipboard" aria-label="Copy note">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
            </svg>
          </button>
          <button id="clear-btn" class="icon-btn" title="Clear note" aria-label="Clear note">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6" />
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
            </svg>
          </button>
        </div>
      </header>

      <div id="timestamp-bar" class="timestamp-bar hidden" aria-label="Jump video to timestamp">
        <button id="quick-jump-btn" class="quick-jump-btn" type="button" title="Jump YouTube video to this timestamp">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3" />
          </svg>
          <span id="quick-jump-text">Jump video to 00:00:00.000</span>
        </button>
      </div>

      <main class="editor-section">
        <div class="editor-container">
          <div id="highlight-layer" class="highlight-layer" aria-hidden="true"></div>
          <textarea
            id="note-textarea"
            placeholder="Jot down quick thoughts, links, or scratchpad notes..."
            autofocus
            spellcheck="false"
          ></textarea>
        </div>
      </main>

      <footer class="app-footer">
        <div class="meta-info">
          <span id="char-count">0 chars</span>
          <span class="divider">·</span>
          <span id="word-count">0 words</span>
        </div>
        <div id="toast" class="toast" aria-live="polite"></div>
      </footer>
    </div>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
